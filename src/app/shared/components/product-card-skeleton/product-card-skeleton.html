
<!-- SEVENS Aquatics - Product Card Skeleton -->

<div class="product-card-skeleton" aria-hidden="true">

  <!-- Product Image -->
  <div class="skeleton-image">
    <app-skeleton-loader
      width="100%"
      height="100%"
      borderRadius="0px"
    />
  </div>

  <!-- Product Information -->
  <div class="skeleton-info">

    <!-- Category -->
    <app-skeleton-loader
      shape="text"
      width="45%"
      height="12px"
    />

    <!-- Product Name -->
    <app-skeleton-loader
      shape="text"
      width="85%"
      height="24px"
    />

    <!-- Price and Stock Status -->
    <div class="skeleton-meta">

      <app-skeleton-loader
        width="100%"
        height="24px"
      />

      <app-skeleton-loader
        width="100%"
        height="14px"
      />

    </div>

    <!-- View Details Button -->
    <app-skeleton-loader
      width="100%"
      height="42px"
      borderRadius="8px"
    />

  </div>

</div>
